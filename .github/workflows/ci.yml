name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run check:bundle
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:e2e

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        run: PYTHONPATH=. pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: meeteat
          POSTGRES_USER: meeteat
          POSTGRES_PASSWORD: meeteat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeteat -d meeteat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://meeteat:meeteat@localhost:5432/meeteat
      ZAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        run: PYTHONPATH=. python scripts/verify_postgres.py
