<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">MeetEat — End-to-End Application Flow</text>

  <!-- Row 1 -->
  <rect x="30" y="70" width="190" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="98" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">Landing Screen</text>
  <text x="125" y="117" text-anchor="middle" font-size="11.5" fill="#1e40af">Start new / demo sandbox</text>

  <line x1="220" y1="105" x2="270" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="270" y="70" width="190" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="365" y="98" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">Room Created</text>
  <text x="365" y="117" text-anchor="middle" font-size="11.5" fill="#1e40af">Shareable /room/{code} URL</text>

  <line x1="460" y1="105" x2="510" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="510" y="70" width="220" height="70" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="620" y="93" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e3a8a">Participants Join</text>
  <text x="620" y="111" text-anchor="middle" font-size="11.5" fill="#1e40af">Location, budget, cuisine,</text>
  <text x="620" y="127" text-anchor="middle" font-size="11.5" fill="#1e40af">dietary, rating, travel mode</text>

  <line x1="620" y1="140" x2="620" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 2 -->
  <rect x="510" y="185" width="220" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="620" y="211" text-anchor="middle" font-size="13.5" font-weight="600" fill="#14532d">Loading Screen</text>
  <text x="620" y="229" text-anchor="middle" font-size="11.5" fill="#166534">Triggers recommendation run</text>

  <line x1="510" y1="215" x2="460" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="230" y="185" width="230" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="345" y="209" text-anchor="middle" font-size="13.5" font-weight="600" fill="#78350f">POST .../recommendations</text>
  <text x="345" y="228" text-anchor="middle" font-size="11.5" fill="#78350f">Deterministic scoring engine runs</text>

  <line x1="345" y1="245" x2="345" y2="290" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 3 -->
  <rect x="230" y="290" width="230" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="345" y="314" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4c1d95">Results Screen</text>
  <text x="345" y="332" text-anchor="middle" font-size="11.5" fill="#4c1d95">Top 3 ranked restaurants,</text>
  <text x="345" y="348" text-anchor="middle" font-size="11.5" fill="#4c1d95">score breakdown, AI explanation</text>

  <line x1="460" y1="325" x2="510" y2="325" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="510" y="290" width="220" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="620" y="314" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4c1d95">Participant Votes</text>
  <text x="620" y="332" text-anchor="middle" font-size="11.5" fill="#4c1d95">One active vote per</text>
  <text x="620" y="348" text-anchor="middle" font-size="11.5" fill="#4c1d95">participant, persisted</text>

  <line x1="620" y1="360" x2="620" y2="405" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Row 4 -->
  <rect x="510" y="405" width="220" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="430" text-anchor="middle" font-size="13.5" font-weight="600" fill="#7f1d1d">Winner Screen</text>
  <text x="620" y="448" text-anchor="middle" font-size="11.5" fill="#991b1b">GET /api/rooms/{code}/winner</text>

  <line x1="510" y1="435" x2="460" y2="435" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <rect x="30" y="405" width="230" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="145" y="430" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">Room re-opened later</text>
  <text x="145" y="448" text-anchor="middle" font-size="11.5" fill="#334155">shared room state reloads via room code</text>

  <line x1="145" y1="405" x2="230" y2="245" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow2)"/>

  <text x="480" y="505" text-anchor="middle" font-size="12" fill="#475569">Every step persists to PostgreSQL through the FastAPI backend, so a shared room can be reopened by URL at any point.</text>
  <text x="480" y="525" text-anchor="middle" font-size="12" fill="#475569">Frontend failures surface through a reusable error banner instead of failing silently.</text>
</svg>
