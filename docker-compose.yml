services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://meeteat:meeteat@postgres:5432/meeteat
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meeteat
      POSTGRES_USER: meeteat
      POSTGRES_PASSWORD: meeteat
    ports:
      - "5432:5432"
    volumes:
      - meeteat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeteat -d meeteat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meeteat-postgres-data:
